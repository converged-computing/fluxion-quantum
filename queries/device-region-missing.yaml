# EXPECT: NOT SATISFIED. No backend has region=eu-central-1, so the constraint
# prunes BOTH qdevices. Proves the filter actually excludes non-matches (a true
# negative, not "matches everything").
version: 9999
resources:
  - type: slot
    count: 1
    label: device
    with:
      - type: qpu
        count: 1
attributes:
  system:
    duration: 0
    constraints:
      properties: ["virtual=true", "fluxion.flux-framework.org/region=eu-central-1"]
tasks:
  - command: ["sampler"]
    slot: device
    count:
      per_slot: 1